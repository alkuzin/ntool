# Project package info section.
[package]
name        = "ntool"
version     = "0.1.0"
description = "Multifunctional network analyser tool"
authors     = ["Alexander Kuzin <alkuzindev@gmail.com>"]
repository  = "https://github.com/alkuzin/ntool/ntool"
license     = "Apache-2.0"
edition     = "2024"

# Project dependencies section.
[dependencies]
# Ntool ping network diagnostic tool.
ntool-ping = { path = "../ntool-ping" }
# Command-line argument parser.
clap = { workspace = true }
# Date and time handling library.
chrono = { workspace = true }
# Raw FFI bindings to platforms' system libraries.
libc = { workspace = true }
